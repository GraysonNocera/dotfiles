unbind C-b

set -g set-clipboard external
set -g allow-passthrough on

# Use a 256-color, truecolor-capable terminal type *inside* tmux (the default
# fallback, screen-256color, makes nvim think it can't do 24-bit color).
set -g default-terminal 'tmux-256color'
# Advertise the outer terminal's capabilities so they pass through to nvim:
# RGB = 24-bit truecolor, clipboard = OSC 52 copy. Adjust "xterm-256color" if
# your terminal reports a different $TERM (echo $TERM outside tmux).
set -as terminal-features ',xterm-256color:RGB:clipboard'

setenv -g SSH_AUTH_SOCK $HOME/.ssh/ssh_auth_sock

set-option -g prefix C-Space
bind-key C-Space send-prefix

set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'

# Restore scrollback in restored sessions (default only restores layout, not
# pane contents -> restored windows come back with empty history).
set -g @resurrect-capture-pane-contents 'on'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'jaclu/tmux-menus'
# --- status bar (truecolor; requires RGB passthrough, set above) ------------
set -g status-style 'bg=#1e1e2e fg=#cdd6f4'

# left: session name as a colored pill
set -g status-left ' #S '
set -g status-left-style 'bg=#89b4fa fg=#1e1e2e bold'
set -g status-left-length 30

# window list: highlight the active window
set -g window-status-format ' #I #W '
set -g window-status-current-format ' #I #W '
set -g window-status-current-style 'bg=#89b4fa fg=#1e1e2e bold'

# right: a "Prefix" pill (only while the prefix is active) styled like the
# window boxes, then date/time. Commas inside the #{?...} are escaped as #,.
set -g status-right '#{?client_prefix,#[fg=#1e1e2e#,bg=#89b4fa#,bold] Prefix #[default] ,}%a %b %d  %H:%M '
set -g status-right-style 'fg=#a6adc8'
set -g status-right-length 40

# pane borders that match the accent
set -g pane-border-style 'fg=#45475a'
set -g pane-active-border-style 'fg=#89b4fa'

if-shell '[ -n "$SSH_CONNECTION" ]' \
  'set -g mouse off' \
  'set -g mouse on'

set-window-option -g mode-keys vi
set-option -g renumber-windows on

# Pass terminal focus in/out events through to programs inside panes. Without
# this, tmux swallows them and nvim's FocusGained autocmds (LazyVim's checktime
# on FocusGained/TermClose/TermLeave) never fire, so files don't auto-reload
# when you alt-tab back into the terminal.
set -g focus-events on

set -sg escape-time 0

# prefix + e: re-source ~/.zshrc in every zsh pane across all sessions. The awk
# filter targets only panes currently at a zsh prompt, so it won't inject the
# command into vim, a REPL, or a pager. The leading space keeps it out of
# history (HIST_IGNORE_SPACE).
bind e run-shell "tmux list-panes -a -F '#{pane_id} #{pane_current_command}' | awk '\$2==\"zsh\"{print \$1}' | while read -r p; do tmux send-keys -t \"\$p\" ' source ~/.zshrc' Enter; done"

run '~/.tmux/plugins/tpm/tpm'
